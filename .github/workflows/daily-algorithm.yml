name: 오늘의 알고리즘 문제

on:
  schedule:
    # GitHub Actions의 기본 UTC 해석에 기대지 않고 한국시간을 명시합니다.
    # 정각 혼잡을 피해 월~금 오전 09:07에 실행을 요청합니다.
    - cron: "7 9 * * 1-5"
      timezone: "Asia/Seoul"
  workflow_dispatch:
    inputs:
      study_date:
        description: "출제할 날짜 (YYYY-MM-DD, 비우면 오늘 KST)"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-algorithm
  cancel-in-progress: false

jobs:
  create-problems:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v6

      - name: 상·중·하 Issue와 Discord 알림 생성
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STUDY_DATE: ${{ inputs.study_date }}
        run: node scripts/create-daily-algorithm.mjs
